# Continuous integration: builds and tests all three parts on every push and pull request.
name: CI

on:
  push:
    branches: [main, 'iter/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (C++ build, ctest, clang-format)
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug

      # Without arguments simcore serves forever; check the CLI modes that terminate instead.
      - name: Run simcore
        run: |
          ./build/debug/core/simcore --version
          ./build/debug/core/simcore --sweep 1000 7000 | tail -n 3

      # Same clang-format version as on the developer machine (docs/setup.md):
      # different versions format slightly differently.
      - name: Check formatting
        run: |
          pipx install clang-format==21.1.8
          find core -name '*.[ch]pp' -print0 | xargs -0 clang-format --dry-run --Werror

  lab:
    name: lab (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported version (pyproject.toml) and the developer's version.
        python-version: ['3.12', '3.14']
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lab/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest

  ui:
    name: ui (lint, format, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Acceptance test of iteration 6: the real UI store talks to a real simcore over WebSocket.
  e2e:
    name: e2e (UI store against simcore)
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build simcore
        run: |
          cmake --preset debug
          cmake --build --preset debug --target simcore

      - name: Install UI
        working-directory: ui
        run: npm ci

      # The test reconnects until simcore listens, so no explicit wait is needed.
      - name: Run end-to-end test
        run: |
          ./build/debug/core/simcore --no-audio &
          cd ui && npm run test:e2e
